name: CI

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requerido por el analisis de SonarQube

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:coverage

      # Umbral critical: los avisos altos actuales vienen de herramientas de compilacion (braces, node-forge), no del codigo de la app
      - run: npm audit --omit=dev --audit-level=critical

      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Pruebas de mutacion solo sobre los archivos de logica que cambiaron en el PR.
  mutacion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ github.run_id }}
          restore-keys: stryker-${{ github.base_ref }}-

      - name: Mutar los archivos cambiados
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Mismas exclusiones que "mutate" en stryker.config.json
          archivos=$(git diff --name-only --diff-filter=AMR "$BASE...HEAD" \
            | grep -E '^lib/.*\.ts$' \
            | grep -vE '\.web\.ts$|^lib/(firebase|theme|utils|dev-session|google-sign-in|session-storage)\.ts$' \
            | paste -sd, - || true)
          if [ -z "$archivos" ]; then
            echo "No hay archivos de logica (lib/) que mutar en este PR."
            exit 0
          fi
          echo "Mutando: $archivos"
          npx stryker run --mutate "$archivos"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-mutacion
          path: reports/mutation
          if-no-files-found: ignore
